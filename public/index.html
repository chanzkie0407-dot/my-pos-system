<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINUTE BURGER POS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            height: 100vh;
            overflow: hidden;
            background: #f5f5f5;
        }

        /* === LAYOUT === */
        .app {
            display: flex;
            height: 100vh;
        }

        /* === SIDEBAR === */
        .sidebar {
            width: 220px;
            background: #fff;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            background: #00a000;
            color: white;
            padding: 15px;
        }
        .sidebar-header h1 {
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-header p {
            font-size: 13px;
            margin-top: 5px;
            opacity: 0.9;
        }
        .sidebar-menu {
            flex: 1;
            padding-top: 10px;
        }
        .menu-item {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            color: #333;
            cursor: pointer;
        }
        .menu-item.active {
            background: #e6f9e6;
            color: #008000;
            font-weight: bold;
        }
        .sidebar-footer {
            padding: 15px;
            border-top: 1px solid #ddd;
            font-size: 13px;
            color: #666;
        }

        /* === MAIN CONTENT — PRODUKTO === */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .top-bar {
            background: #00a000;
            color: white;
            padding: 10px 20px;
            font-size: 15px;
        }

        /* === CATEGORY TABS === */
        .tabs {
            display: flex;
            background: white;
            border-bottom: 1px solid #ddd;
            overflow-x: auto;
        }
        .tab {
            padding: 14px 20px;
            font-size: 15px;
            border: none;
            background: transparent;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            white-space: nowrap;
        }
        .tab.active {
            color: #008000;
            border-bottom-color: #00a000;
            font-weight: bold;
        }

        /* === PRODUKTO GRID — DITO LALABAS ANG MENU! === */
        .products {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }
        .item-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: 0.15s;
        }
        .item-card:active {
            transform: scale(0.96);
        }
        .item-img {
            height: 120px;
            background: linear-gradient(135deg, #ffcc66, #ff9900);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: white;
        }
        .item-info {
            padding: 12px;
        }
        .item-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.3;
            min-height: 36px;
        }
        .item-price {
            font-size: 18px;
            font-weight: bold;
            color: #008000;
        }

        /* === TICKET PANEL — KANAN === */
        .ticket {
            width: 360px;
            background: white;
            border-left: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }
        .ticket-header {
            padding: 15px 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ticket-header h2 {
            font-size: 20px;
        }
        .clear-btn {
            color: #e53935;
            cursor: pointer;
            font-size: 15px;
        }
        .ticket-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .empty {
            text-align: center;
            color: #999;
            padding: 60px 20px;
            font-size: 16px;
        }
        .ticket-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .qty {
            background: #eee;
            width: 28px;
            height: 28px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 10px;
        }
        .item-left {
            display: flex;
            align-items: center;
        }
        .remove {
            color: #e53935;
            margin-left: 8px;
            cursor: pointer;
            font-size: 20px;
        }
        .ticket-footer {
            border-top: 1px solid #ddd;
            padding: 20px;
        }
        .total-line {
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: bold;
            padding: 10px 0 20px;
        }
        .total-amt {
            color: #008000;
            font-size: 28px;
        }
        .pay-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .pay-btn {
            padding: 12px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }
        .pay-btn.selected {
            border-color: #00a000;
            background: #e6f9e6;
            color: #008000;
            font-weight: bold;
        }
        .cash-label {
            font-size: 15px;
            margin-bottom: 8px;
            display: block;
        }
        .cash-input {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 12px;
            text-align: right;
        }
        .change {
            background: #e3f2fd;
            padding: 12px;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            color: #1565c0;
            margin-bottom: 15px;
            display: none;
        }
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .hold-btn {
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background: #ff9800;
            color: white;
            cursor: pointer;
        }
        .charge-btn {
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background: #00a000;
            color: white;
            cursor: pointer;
        }

        /* === START SHIFT MODAL === */
        .modal-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .modal {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
        }
        .modal h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #008000;
        }
        .modal input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .modal-btn {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background: #00a000;
            color: white;
            cursor: pointer;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- START SHIFT — LALABAS UNA -->
    <div class="modal-bg" id="startModal">
        <div class="modal">
            <h2>🕒 START SHIFT</h2>
            <input type="text" id="cashierName" placeholder="Pangalan ng Cashier" required>
            <input type="number" id="openingCash" placeholder="Puhunan / Opening Cash" step="0.01">
            <button class="modal-btn" onclick="startApp()">✅ SIMULAN</button>
        </div>
    </div>

    <!-- BUONG APP — HIDDEN MUNA -->
    <div class="app hidden" id="app">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>🍔 MINUTE BURGER</h1>
                <p id="currentDate">—</p>
            </div>
            <div class="sidebar-menu">
                <div class="menu-item active">🛒 Sales</div>
                <div class="menu-item">📄 Receipts</div>
                <div class="menu-item">🕒 Shift</div>
                <div class="menu-item">📦 Items</div>
                <div class="menu-item">⚙️ Settings</div>
            </div>
            <div class="sidebar-footer">
                <p id="cashierLabel">Cashier: —</p>
                <p>v2.0</p>
            </div>
        </div>

        <!-- MAIN — PRODUKTO & TABS -->
        <div class="main">
            <div class="top-bar" id="topCashierName">—</div>
            
            <!-- TABS — DITO PIPILI NG KATEGORYA -->
            <div class="tabs" id="categoryTabs">
                <button class="tab active" data-cat="burgers" onclick="changeTab('burgers')">🍔 SULIT</button>
                <button class="tab" data-cat="chicken" onclick="changeTab('chicken')">🍗 CHICKEN TIME</button>
                <button class="tab" data-cat="premium" onclick="changeTab('premium')">⭐ PREMIUM</button>
                <button class="tab" data-cat="hotdogs" onclick="changeTab('hotdogs')">🌭 HOTDOGS</button>
                <button class="tab" data-cat="drinks" onclick="changeTab('drinks')">🥤 DRINKS</button>
                <button class="tab" data-cat="extras" onclick="changeTab('extras')">🧂 EXTRAS</button>
            </div>

            <!-- PRODUKTO — DITO LALABAS ANG MENU! -->
            <div class="products">
                <div class="grid" id="productGrid">
                    <!-- DYNAMICALLY LOADED -->
                </div>
            </div>
        </div>

        <!-- TICKET — KANAN -->
        <div class="ticket">
            <div class="ticket-header">
                <h2>📋 TICKET</h2>
                <span class="clear-btn" onclick="clearAll()">🗑️ Clear All</span>
            </div>
            <div class="ticket-body" id="ticketBody">
                <div class="empty">Walang items pa...</div>
            </div>
            <div class="ticket-footer">
                <div class="total-line">
                    <span>TOTAL</span>
                    <span class="total-amt">₱<span id="totalAmt">0.00</span></span>
                </div>

                <div class="pay-buttons">
                    <button class="pay-btn selected" data-pay="Cash" onclick="selectPay(this)">💰 Cash</button>
                    <button class="pay-btn" data-pay="GCash" onclick="selectPay(this)">📱 GCash</button>
                    <button class="pay-btn" data-pay="FoodPanda" onclick="selectPay(this)">🐼 FoodPanda</button>
                    <button class="pay-btn" data-pay="Grab" onclick="selectPay(this)">🛵 Grab</button>
                </div>

                <label class="cash-label">💰 Cash Received</label>
                <input type="number" class="cash-input" id="cashReceived" placeholder="0.00" oninput="computeChange()">
                
                <div class="change" id="changeBox">🔁 Sukli: ₱<span id="changeAmt">0.00</span></div>

                <div class="action-buttons">
                    <button class="hold-btn">⏸️ HOLD</button>
                    <button class="charge-btn" onclick="completeSale()">✅ CHARGE</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // ✅ KUMPLETONG LISTAHAN NG PRODUKTO — SIGURADO!
        // ==========================================
        const menu = {
            burgers: [
                {id:'mb',name:'Minute Burger',price:43,icon:'🍔'},
                {id:'cb',name:'Cheesy Burger',price:54,icon:'🍔'},
                {id:'dmb',name:'Double Minute Burger',price:66,icon:'🍔'},
                {id:'dcb',name:'Double Cheesy Burger',price:82,icon:'🍔'}
            ],
            chicken: [
                {id:'ct',name:'Chicken Time Burger',price:52,icon:'🍗'},
                {id:'dct',name:'Double Chicken Time',price:72,icon:'🍗'},
                {id:'cc',name:'Crispy Chicken Chimichurri',price:101,icon:'🍗'},
                {id:'cs',name:'Crispy Chicken Roasted Sesame',price:97,icon:'🍗'}
            ],
            premium: [
                {id:'sb',name:'Steakburger',price:145,icon:'🍔'},
                {id:'bcb',name:'Bacon Cheese Burger',price:99,icon:'🍔'},
                {id:'bp',name:'Black Pepper Burger',price:92,icon:'🍔'},
                {id:'bs',name:'Beef Shawarma Burger',price:94,icon:'🍔'},
                {id:'v50',name:'50/50 Veggie Chicken',price:89,icon:'🍔'}
            ],
            hotdogs: [
                {id:'cd',name:'Cheesydog',price:51,icon:'🌭'},
                {id:'fof',name:'French Onion Franks',price:93,icon:'🌭'},
                {id:'bh',name:'Beef Hungarian',price:114,icon:'🌭'}
            ],
            drinks: [
                {id:'cal',name:'Calamansi Tea',price:26,icon:'🍹'},
                {id:'fw',name:'Fruitwist',price:26,icon:'🥤'},
                {id:'ic',name:'Iced Coffee',price:20,icon:'🧊'},
                {id:'ich',name:'Iced Choco',price:18,icon:'🧊'},
                {id:'hc',name:'Hot Coffee',price:12,icon:'☕'},
                {id:'hch',name:'Hot Choco',price:15,icon:'☕'},
                {id:'water',name:'Bottled Water',price:16,icon:'💧'}
            ],
            extras: [
                {id:'egg',name:'Egg',price:15,icon:'🥚'},
                {id:'cheese',name:'Supreme Cheese',price:15,icon:'🧀'},
                {id:'coleslaw',name:'Coleslaw',price:13,icon:'🥗'}
            ]
        };

        let cart = [];
        let currentCat = 'burgers';
        let ticketNo = 1;

        // ==========================================
        // ✅ SIMULAN ANG APP — LALABAS ANG MENU!
        // ==========================================
        function startApp() {
            const name = document.getElementById('cashierName').value.trim();
            if (!name) { alert('Ilagay ang pangalan ng cashier!'); return; }

            // Itago modal, ipakita app
            document.getElementById('startModal').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');

            // Update info
            const today = new Date();
            document.getElementById('currentDate').textContent = today.toLocaleDateString('en-PH');
            document.getElementById('cashierLabel').textContent = 'Cashier: ' + name;
            document.getElementById('topCashierName').textContent = name;

            // ✅ SIGURADONG LALABAS ANG PRODUKTO!
            renderProducts();
        }

        // ==========================================
        // ✅ PALIT KATEGORYA
        // ==========================================
        function changeTab(cat) {
            currentCat = cat;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderProducts();
        }

        // ==========================================
        // ✅ IPakita ang mga produkto — DITO ANG SIKLO!
        // ==========================================
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            const items = menu[currentCat];
            
            grid.innerHTML = ''; // Clear muna

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.onclick = () => addItem(item);
                card.innerHTML = `
                    <div class="item-img">${item.icon}</div>
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-price">₱${item.price.toFixed(2)}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ==========================================
        // ✅ I-ADD SA TICKET
        // ==========================================
        function addItem(item) {
            const existing = cart.find(c => c.id === item.id);
            if (existing) existing.qty++;
            else cart.push({ ...item, qty: 1 });
            updateTicket();
        }

        // ==========================================
        // ✅ UPDATE TICKET PANEL
        // ==========================================
        function updateTicket() {
            const body = document.getElementById('ticketBody');
            const totalEl = document.getElementById('totalAmt');

            if (cart.length === 0) {
                body.innerHTML = '<div class="empty">Walang items pa...</div>';
                totalEl.textContent = '0.00';
                document.getElementById('changeBox').style.display = 'none';
                return;
            }

            body.innerHTML = '';
            let total = 0;

            cart.forEach((item, idx) => {
                total += item.price * item.qty;
                const div = document.createElement('div');
                div.className = 'ticket-item';
                div.innerHTML = `
                    <div class="item-left">
                        <div class="qty">${item.qty}</div>
                        <div>
                            <div>${item.name}</div>
                            <div style="font-size:13px; color:#666">₱${item.price.toFixed(2)}</div>
                        </div>
                    </div>
                    <div style="display:flex;align-items:center">
                        <span style="font-weight:bold">₱${(item.price*item.qty).toFixed(2)}</span>
                        <span class="remove" onclick="removeItem(${idx})">×</span>
                    </div>
                `;
                body.appendChild(div);
            });

            totalEl.textContent = total.toFixed(2);
            computeChange();
        }

        // ==========================================
        // ✅ ALISIN ANG ITEM
        // ==========================================
        function removeItem(idx) {
            if (cart[idx].qty > 1) cart[idx].qty--;
            else cart.splice(idx, 1);
            updateTicket();
        }

        // ==========================================
        // ✅ CLEAR ALL
        // ==========================================
        function clearAll() {
            if (cart.length === 0) return;
            if (!confirm('Burahin lahat ng items?')) return;
            cart = [];
            document.getElementById('cashReceived').value = '';
            document.getElementById('changeBox').style.display = 'none';
            updateTicket();
        }

        // ==========================================
        // ✅ PILIHANG PARAAN NG BAYAD
        // ==========================================
        function selectPay(btn) {
            document.querySelectorAll('.pay-btn').forEach(b => b.classList.remove('active','selected'));
            btn.classList.add('selected');
        }

        // ==========================================
        // ✅ COMPUTE SUKLI
        // ==========================================
        function computeChange() {
            const total = parseFloat(document.getElementById('totalAmt').textContent) || 0;
            const cash = parseFloat(document.getElementById('cashReceived').value) || 0;
            const box = document.getElementById('changeBox');

            if (cash >= total && total > 0) {
                box.style.display = 'block';
                document.getElementById('changeAmt').textContent = (cash - total).toFixed(2);
            } else {
                box.style.display = 'none';
            }
        }

        // ==========================================
        // ✅ TAPOS NA ANG BENTA
        // ==========================================
        function completeSale() {
            const total = parseFloat(document.getElementById('totalAmt').textContent) || 0;
            if (cart.length === 0) { alert('Walang item!'); return; }
            
            alert(`✅ BENTA TAPOS!\nTICKET #${ticketNo}\nKABUUAN: ₱${total.toFixed(2)}`);
            ticketNo++;
            cart = [];
            document.getElementById('cashReceived').value = '';
            document.getElementById('changeBox').style.display = 'none';
            updateTicket();
        }
    </script>
</body>
</html>
