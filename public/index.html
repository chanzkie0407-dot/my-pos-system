<!DOCTYPE html>
<html>
<head>
  <title>MY POS — Cashier</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; padding: 10px; background: #f5f5f5; }
    .login { max-width: 400px; margin: 100px auto; background: white; padding: 20px; border-radius: 10px; }
    .pos { display: none; }
    .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .product-btn { padding: 15px; background: #4CAF50; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .cart { background: white; padding: 15px; border-radius: 10px; margin-top: 20px; }
    .total { font-size: 24px; font-weight: bold; color: red; }
    button { cursor: pointer; padding: 10px; border: none; border-radius: 5px; }
    .btn-danger { background: #f44336; color: white; }
    .btn-success { background: #4CAF50; color: white; width: 100%; font-size: 20px; padding: 15px; }
    .void-btn { background: orange; color: white; }
  </style>
</head>
<body>

<div class="login" id="loginScreen">
  <h2>🔐 Cashier Login</h2>
  <input type="text" id="username" placeholder="Username" style="width:100%;padding:10px;margin:5px 0;">
  <input type="password" id="password" placeholder="Password" style="width:100%;padding:10px;margin:5px 0;">
  <button onclick="login()" style="width:100%;background:blue;color:white;padding:10px;font-size:18px;">Login</button>
  <p id="loginError" style="color:red;display:none;">Paki ilagay ang Username!</p>
</div>

<div class="pos" id="posScreen">
  <h1>🛒 MY POS — Cashier: <span id="cashierName"></span></h1>
  
  <h3>Products — Click to Add</h3>
  <div class="products" id="productList"></div>
  
  <div class="cart">
    <h3>🛒 Cart</h3>
    <div id="cartItems"></div>
    <hr>
    <div class="total">TOTAL: ₱<span id="grandTotal">0.00</span></div>
    <br>
    <label>Cash Received: ₱</label>
    <input type="number" id="cashReceived" placeholder="0.00" oninput="computeChange()">
    <p>Change: ₱<span id="change">0.00</span></p>
    <br>
    <button class="btn-success" onclick="checkout()">✅ PAY / CHECKOUT</button>
    <button class="void-btn" onclick="requestVoid()">⚠️ REQUEST VOID</button>
    <button class="btn-danger" onclick="clearCart()">🗑️ CLEAR</button>
  </div>
</div>

<script>
let currentUser = null;
let cart = [];
let products = [
  { id: 1, name: 'Coke 500ml', price: 35 },
  { id: 2, name: 'Rice 1kg', price: 55 },
  { id: 3, name: 'Bread', price: 40 },
  { id: 4, name: 'Egg (pc)', price: 10 },
  { id: 5, name: 'Water 500ml', price: 20 },
  { id: 6, name: 'Chips', price: 30 }
];

function login() {
  const user = document.getElementById('username').value.trim();
  if (!user) {
    document.getElementById('loginError').style.display = 'block';
    return;
  }
  currentUser = { username: user, role: 'cashier' };
  document.getElementById('cashierName').textContent = user;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('posScreen').style.display = 'block';
  renderProducts();
}

function renderProducts() {
  const list = document.getElementById('productList');
  list.innerHTML = '';
  products.forEach(function(p) {
    list.innerHTML += '<button class="product-btn" onclick="addToCart(' + p.id + ')">' + p.name + '<br>₱' + p.price.toFixed(2) + '</button>';
  });
}

function addToCart(id) {
  const product = products.find(function(p) { return p.id === id; });
  cart.push({...product});
  updateCart();
}

function updateCart() {
  const cartDiv = document.getElementById('cartItems');
  cartDiv.innerHTML = '';
  let total = 0;
  cart.forEach(function(item, index) {
    total += item.price;
    cartDiv.innerHTML += '<p>' + item.name + ' — ₱' + item.price.toFixed(2) + ' <button onclick="removeFromCart(' + index + ')" style="color:red;padding:2px;">✕</button></p>';
  });
  document.getElementById('grandTotal').textContent = total.toFixed(2);
}

function removeFromCart(index) {
  cart.splice(index, 1);
  updateCart();
}

function computeChange() {
  const total = cart.reduce(function(sum, i) { return sum + i.price; }, 0);
  const cash = parseFloat(document.getElementById('cashReceived').value) || 0;
  document.getElementById('change').textContent = (cash - total).toFixed(2);
}

async function checkout() {
  const total = cart.reduce(function(sum, i) { return sum + i.price; }, 0);
  const cash = parseFloat(document.getElementById('cashReceived').value) || 0;
  if (cart.length === 0) return alert('Walang laman ang cart!');
  if (cash < total) return alert('Kulang ang pera!');
  
  const response = await fetch('/api/transactions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      items: cart, total: total, payment: cash, 
      change: cash - total, cashier: currentUser.username
    })
  });
  
  const result = await response.json();
  alert('✅ SALE SAVED!\nTotal: ₱' + total.toFixed(2) + '\nChange: ₱' + (cash-total).toFixed(2));
  cart = [];
  document.getElementById('cashReceived').value = '';
  updateCart();
}

async function requestVoid() {
  if (!confirm('Mag-request ng VOID sa Admin?')) return;
  const transactionId = prompt('Ipasok ang Transaction ID:');
  const reason = prompt('Bakit kailangan i-void?');
  if (!transactionId || !reason) return;
  
  const response = await fetch('/api/void-request', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      transactionId: transactionId,
      cashier: currentUser.username,
      reason: reason
    })
  });
  
  const result = await response.json();
  alert(result.message + '\n✅ I-notify mo ang Admin!');
}

function clearCart() {
  cart = [];
  document.getElementById('cashReceived').value = '';
  updateCart();
}
</script>
</body>
</html>
